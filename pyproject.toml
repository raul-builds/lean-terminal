[project]
name = "lean-terminal-research"
version = "1.0.0"
description = "Lean Terminal — canonical data layer, walk-forward and event-study research engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"walkforward.py" = ["ALL"]
"analog.py" = ["ALL"]
"battery.py" = ["ALL"]
