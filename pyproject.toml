[project]
name = "lean-terminal-research"
version = "1.0.0"
description = "Lean Terminal — canonical data layer, walk-forward and event-study research engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["lean_data", "prep", "d250r", "analog_pit", "battery_v2"]
